[package]
name = "cowchat-client"
version = "0.9.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cowboyinc/cowchat"
description = "Cowchat client library for agent integration"

[features]
# Native member sessions (actor, @builder, connector keys): the common session
# challenge plus hosted room-key open over the member relay.
member = ["dep:k256", "dep:sha3", "dep:hex", "dep:reqwest", "dep:rand_core", "dep:cowboy-protocol-client-crypto"]

[dependencies]
zeroize = "1"
k256 = { version = "0.13", features = ["ecdsa"], optional = true }
sha3 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# The browser's own room-context parser, release composition and owner setup
# attempt; the member relay is the only transport.
cowboy-protocol-client-crypto = { path = "../cowboy-protocol-client-crypto", optional = true }
cowchat-core = { path = "../cowchat-core" }
tokio = { version = "1", features = ["full", "net", "io-util", "sync", "rt", "macros", "time"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# Pin the rustls crypto provider to ring (matches the rest of the project and
# avoids the aws-lc-rs C dependency). The provider is installed in connect_ws.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
