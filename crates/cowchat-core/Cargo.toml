[package]
name = "cowchat-core"
version = "0.9.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cowboyinc/cowchat"
description = "Shared types and protocol definitions for Cowchat"

[dependencies]
cowchat-crypto = { path = "../cowchat-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chacha20poly1305 = "0.10"
base64 = "0.22"
sha3 = "0.10"
