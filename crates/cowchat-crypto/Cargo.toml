[package]
name = "cowchat-crypto"
version = "0.9.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cowboyinc/cowchat"
description = "Cowchat v3 deterministic encoding and cryptographic primitives"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
ciborium = "0.2"
ed25519-dalek = { version = "2", features = ["zeroize"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hpke = { version = "0.13", features = ["x25519"] }
zeroize = "1"
rand = "0.9"
hex = "0.4"

[dev-dependencies]
serde_json = "1"
